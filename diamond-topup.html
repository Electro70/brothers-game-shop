<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Vault — Diamond Top-Up</title>
  <style>
    :root {
      --bg: #f6faf7;
      --surface: #ffffff;
      --surface-soft: #f2f7f4;
      --border: #e2ece6;
      --text: #14221b;
      --muted: #687b71;
      --green: #0f9d58;
      --green-dark: #0b7d45;
      --green-soft: rgba(15, 157, 88, 0.12);
      --verified-bg: linear-gradient(135deg, #eefaf3 0%, #e4f6ec 100%);
      --verified-border: #bfe8d1;
      --chip-blue-bg: #e7f0ff;
      --chip-blue-text: #2563eb;
      --chip-purple-bg: #f3e8ff;
      --chip-purple-text: #7e22ce;
      --chip-green-bg: #dcfce7;
      --chip-green-text: #15803d;
      --danger: #dc2626;
      --shadow: 0 2px 10px rgba(15, 45, 28, 0.04);
    }

    [data-theme="dark"] {
      --bg: #08120d;
      --surface: #0f1d16;
      --surface-soft: #15281f;
      --border: #1e372b;
      --text: #e8f5ee;
      --muted: #8ea89b;
      --green: #16a34a;
      --green-dark: #15803d;
      --green-soft: rgba(22, 163, 74, 0.18);
      --verified-bg: linear-gradient(135deg, #10261b 0%, #143022 100%);
      --verified-border: #1f4c36;
      --chip-blue-bg: rgba(37, 99, 235, 0.2);
      --chip-blue-text: #60a5fa;
      --chip-purple-bg: rgba(126, 34, 206, 0.22);
      --chip-purple-text: #c084fc;
      --chip-green-bg: rgba(21, 128, 61, 0.24);
      --chip-green-text: #4ade80;
      --danger: #f87171;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--text);
      flex-shrink: 0;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--green), var(--green-dark));
      display: grid;
      place-items: center;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 157, 88, 0.25);
    }

    .brand-logo svg {
      width: 21px;
      height: 21px;
    }

    .brand-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--green);
    }

    .brand-text span {
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    /* Language Switcher */
    .lang-box {
      position: relative;
    }

    .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .flag-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      font-size: 11px;
      background: var(--green-soft);
      overflow: hidden;
    }

    .lang-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 124px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      z-index: 40;
    }

    .lang-menu.open {
      display: block;
    }

    .lang-option {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 9px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lang-option:hover {
      background: var(--surface-soft);
    }

    /* Theme Icon Toggle (No text) */
    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .theme-btn svg {
      width: 17px;
      height: 17px;
    }

    /* Profile + Balance Pill */
    .profile-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 8px 0 5px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .profile-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--green-soft);
      border: 1px solid var(--border);
    }

    .balance-info {
      display: flex;
      flex-direction: column;
      line-height: 1.08;
    }

    .balance-lbl {
      font-size: 10px;
      color: var(--muted);
      font-weight: 500;
    }

    .balance-amt {
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
    }

    .add-balance-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--green);
      background: transparent;
      color: var(--green);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    /* Main Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px;
    }

    /* Back Bar */
    .back-bar {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    .back-bar:hover {
      border-color: var(--green);
    }

    /* Step 1 Header */
    .step-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .step-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--green);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .step-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    /* Verification Card */
    .verify-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .player-id-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .player-id-label svg {
      width: 15px;
      height: 15px;
      color: var(--text);
    }

    .verify-form-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .uid-field-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .uid-input {
      width: 100%;
      height: 44px;
      padding: 0 38px 0 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    [data-theme="dark"] .uid-input {
      border-color: #284738;
    }

    .uid-input:focus {
      border-color: var(--green);
    }

    .recent-toggle-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 8px;
    }

    .recent-toggle-btn:hover {
      background: var(--surface-soft);
      color: var(--text);
    }

    .recent-dropdown {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 5px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 25;
      overflow: hidden;
    }

    .recent-dropdown.open {
      display: block;
    }

    .recent-empty {
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .recent-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 9px 12px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .recent-item:hover {
      background: var(--surface-soft);
    }

    .recent-item span {
      font-size: 11px;
      color: var(--muted);
    }

    .verify-btn {
      height: 44px;
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .verify-btn:hover {
      background: var(--green-dark);
    }

    .verify-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .subtext {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .subtext.error {
      color: var(--danger);
    }

    /* Verified Result Card */
    .verified-card {
      display: none;
      background: var(--verified-bg);
      border: 1px solid var(--verified-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .verified-card.show {
      display: block;
    }

    .verified-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--verified-border);
    }

    .verified-user {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar-wrap {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--green);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: #ffffff;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .avatar-wrap.has-img svg.fallback-user {
      display: none;
    }

    .avatar-wrap.has-img img {
      display: block;
    }

    .check-badge {
      position: absolute;
      right: -2px;
      bottom: -1px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--green);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    .user-meta {
      min-width: 0;
    }

    .player-nickname {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      word-break: break-word;
    }

    .player-uid-line {
      margin-top: 3px;
      font-size: 13px;
      color: var(--muted);
    }

    .player-uid-line strong {
      color: var(--green);
      font-weight: 700;
    }

    .change-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .change-btn:hover {
      border-color: var(--green);
    }

    .verified-pills {
      margin-top: 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill-level {
      background: var(--chip-blue-bg);
      color: var(--chip-blue-text);
    }

    .pill-region {
      background: var(--chip-purple-bg);
      color: var(--chip-purple-text);
    }

    .pill-likes {
      background: var(--chip-green-bg);
      color: var(--chip-green-text);
    }

    @media (max-width: 480px) {
      .brand-text {
        font-size: 15px;
      }
      .balance-info {
        display: none;
      }
      .verify-btn {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Game Vault">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.8 8 12 11.7 5.2 8 12 4.3zM5 9.8l6 3.3v6.5l-6-3.3V9.8zm14 6.5-6 3.3v-6.5l6-3.3v6.5z"/>
          </svg>
        </div>
        <div class="brand-text">GAME <span>VAULT</span></div>
      </a>

      <div class="header-right">
        <!-- Language Switcher -->
        <div class="lang-box">
          <button type="button" class="lang-btn" id="langBtn" aria-label="Language">
            <span class="flag-dot" id="langFlag">🇺🇸</span>
            <span id="langCode">EN</span>
            <span>⌄</span>
          </button>
          <div class="lang-menu" id="langMenu">
            <button type="button" class="lang-option" data-lang="en">
              <span>🇺🇸 English</span>
              <span>EN</span>
            </button>
            <button type="button" class="lang-option" data-lang="bn">
              <span>🇧🇩 বাংলা</span>
              <span>BN</span>
            </button>
          </div>
        </div>

        <!-- Dark / Bright Theme Icon Only -->
        <button type="button" class="theme-btn" id="themeBtn" aria-label="Theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <!-- Profile + Balance + + -->
        <div class="profile-pill">
          <img
            class="profile-avatar"
            id="profileAvatar"
            src="https://noobs-api.top/api/ff-info-pic?uid=2911395896"
            alt="Profile"
          />
          <div class="balance-info">
            <span class="balance-lbl" id="balanceLbl">Balance</span>
            <span class="balance-amt">৳ 0</span>
          </div>
          <button type="button" class="add-balance-btn" id="addBalanceBtn" aria-label="Add Balance">+</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Back Bar -->
    <button type="button" class="back-bar" id="backBtn">
      <span>‹</span>
      <span id="backText">Back</span>
    </button>

    <!-- Step 1 Title -->
    <div class="step-row">
      <div class="step-badge">1</div>
      <h2 class="step-title" id="stepTitle">Player Verification</h2>
    </div>

    <!-- Before Verify Box -->
    <section class="verify-card" id="verifyCard">
      <label for="uidInput" class="player-id-label">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-5.33 0-8 2.67-8 5v1h16v-1c0-2.33-2.67-5-8-5z"/>
        </svg>
        <span id="playerIdLabel">Player ID</span>
      </label>

      <div class="verify-form-row">
        <div class="uid-field-wrap">
          <input
            type="text"
            id="uidInput"
            class="uid-input"
            placeholder="Enter your Free Fire ID"
            inputmode="numeric"
            autocomplete="off"
          />
          <button type="button" class="recent-toggle-btn" id="recentToggleBtn" aria-label="Recent UIDs">
            ⌄
          </button>
          <div class="recent-dropdown" id="recentDropdown"></div>
        </div>

        <button type="button" class="verify-btn" id="verifyBtn">Verify</button>
      </div>

      <div class="subtext" id="subtext">
        <span>ⓘ</span>
        <span id="subtextMsg">Click Verify to confirm your Free Fire account!</span>
      </div>
    </section>

    <!-- After Verify Box -->
    <section class="verified-card" id="verifiedCard">
      <div class="verified-top">
        <div class="verified-user">
          <div class="avatar-wrap" id="avatarWrap">
            <svg class="fallback-user" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-5.33 0-8 2.67-8 5v1h16v-1c0-2.33-2.67-5-8-5z"/>
            </svg>
            <img id="gameAvatarImg" src="" alt="Game Avatar" />
            <span class="check-badge">✓</span>
          </div>

          <div class="user-meta">
            <div class="player-nickname" id="playerNickname">-</div>
            <div class="player-uid-line">
              <span id="playerIdPrefix">Player ID:</span>
              <strong id="verifiedUid">-</strong>
            </div>
          </div>
        </div>

        <button type="button" class="change-btn" id="changeBtn">Change</button>
      </div>

      <div class="verified-pills">
        <span class="meta-pill pill-level" id="levelPill">★ Lv 0</span>
        <span class="meta-pill pill-region" id="regionPill">📍 BD</span>
        <span class="meta-pill pill-likes" id="likesPill">👍 0</span>
      </div>
    </section>
  </main>

  <script>
    const WORKER_URL = "https://game-vault-ff-api.theummah234.workers.dev";
    const RECENT_KEY = "gv_recent_uids";

    const translations = {
      en: {
        balance: "Balance",
        back: "Back",
        stepTitle: "Player Verification",
        playerId: "Player ID",
        placeholder: "Enter your Free Fire ID",
        verify: "Verify",
        subtext: "Click Verify to confirm your Free Fire account!",
        checking: "Verifying Free Fire account...",
        invalidUid: "Please enter a valid Free Fire UID.",
        notFound: "Player account not found.",
        netError: "Connection error. Please try again.",
        change: "Change",
        noRecent: "No recent UIDs",
        levelPrefix: "Lv"
      },
      bn: {
        balance: "ব্যালেন্স",
        back: "ব্যাক",
        stepTitle: "প্লেয়ার ভেরিফিকেশন",
        playerId: "প্লেয়ার আইডি",
        placeholder: "তোমার ফ্রি ফায়ার আইডি লিখো",
        verify: "ভেরিফাই",
        subtext: "তোমার ফ্রি ফায়ার অ্যাকাউন্ট নিশ্চিত করতে Verify চাপো!",
        checking: "ফ্রি ফায়ার অ্যাকাউন্ট যাচাই করা হচ্ছে...",
        invalidUid: "সঠিক ফ্রি ফায়ার UID লিখো।",
        notFound: "এই UID-এর কোনো প্লেয়ার পাওয়া যায়নি।",
        netError: "কানেকশন সমস্যা। আবার চেষ্টা করো।",
        change: "পরিবর্তন",
        noRecent: "কোনো রিসেন্ট UID নেই",
        levelPrefix: "লেভেল"
      }
    };

    let currentLang = "en";

    const langBtn = document.getElementById("langBtn");
    const langMenu = document.getElementById("langMenu");
    const langFlag = document.getElementById("langFlag");
    const langCode = document.getElementById("langCode");
    const themeBtn = document.getElementById("themeBtn");
    const themeIcon = document.getElementById("themeIcon");
    const backBtn = document.getElementById("backBtn");

    const verifyCard = document.getElementById("verifyCard");
    const verifiedCard = document.getElementById("verifiedCard");
    const uidInput = document.getElementById("uidInput");
    const recentToggleBtn = document.getElementById("recentToggleBtn");
    const recentDropdown = document.getElementById("recentDropdown");
    const verifyBtn = document.getElementById("verifyBtn");
    const subtext = document.getElementById("subtext");
    const subtextMsg = document.getElementById("subtextMsg");

    const avatarWrap = document.getElementById("avatarWrap");
    const gameAvatarImg = document.getElementById("gameAvatarImg");
    const playerNickname = document.getElementById("playerNickname");
    const verifiedUid = document.getElementById("verifiedUid");
    const changeBtn = document.getElementById("changeBtn");
    const levelPill = document.getElementById("levelPill");
    const regionPill = document.getElementById("regionPill");
    const likesPill = document.getElementById("likesPill");

    function applyLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      const t = translations[lang];

      langFlag.textContent = lang === "bn" ? "🇧🇩" : "🇺🇸";
      langCode.textContent = lang.toUpperCase();

      document.getElementById("balanceLbl").textContent = t.balance;
      document.getElementById("backText").textContent = t.back;
      document.getElementById("stepTitle").textContent = t.stepTitle;
      document.getElementById("playerIdLabel").textContent = t.playerId;
      uidInput.placeholder = t.placeholder;
      verifyBtn.textContent = t.verify;
      subtextMsg.textContent = t.subtext;
      document.getElementById("playerIdPrefix").textContent = t.playerId + ":";
      changeBtn.textContent = t.change;
      renderRecentDropdown();
    }

    langBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      langMenu.classList.toggle("open");
      recentDropdown.classList.remove("open");
    });

    langMenu.addEventListener("click", (e) => {
      const opt = e.target.closest(".lang-option");
      if (!opt) return;
      applyLanguage(opt.dataset.lang);
      langMenu.classList.remove("open");
    });

    function updateThemeIcon(theme) {
      if (theme === "dark") {
        themeIcon.innerHTML = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>`;
      } else {
        themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
      }
    }

    themeBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      updateThemeIcon(next);
    });

    backBtn.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      }
    });

    function getRecentUids() {
      try {
        return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveRecentUid(uid, nickname) {
      const list = getRecentUids().filter((item) => item.uid !== uid);
      list.unshift({ uid, nickname });
      localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5)));
      renderRecentDropdown();
    }

    function renderRecentDropdown() {
      const list = getRecentUids();
      const t = translations[currentLang];
      if (!list.length) {
        recentDropdown.innerHTML = `<div class="recent-empty">${t.noRecent}</div>`;
        return;
      }
      recentDropdown.innerHTML = list
        .map(
          (item) =>
            `<button type="button" class="recent-item" data-uid="${item.uid}">
              <strong>${item.uid}</strong>
              <span>${item.nickname || ""}</span>
            </button>`
        )
        .join("");
    }

    recentToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      renderRecentDropdown();
      recentDropdown.classList.toggle("open");
      langMenu.classList.remove("open");
    });

    recentDropdown.addEventListener("click", (e) => {
      const item = e.target.closest(".recent-item");
      if (!item) return;
      uidInput.value = item.dataset.uid;
      recentDropdown.classList.remove("open");
    });

    document.addEventListener("click", () => {
      langMenu.classList.remove("open");
      recentDropdown.classList.remove("open");
    });

    function setSubtext(msg, isError = false) {
      subtextMsg.textContent = msg;
      subtext.classList.toggle("error", isError);
    }

    async function verifyPlayer() {
      const uid = uidInput.value.trim();
      const t = translations[currentLang];

      if (!/^\d{5,15}$/.test(uid)) {
        setSubtext(t.invalidUid, true);
        return;
      }

      verifyBtn.disabled = true;
      setSubtext(t.checking, false);

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid })
        });

        const data = await res.json();
        const basic = data?.data?.info?.basicInfo;

        if (!res.ok || !data?.ok || !basic) {
          setSubtext(data?.error || t.notFound, true);
          return;
        }

        const nickname = basic.nickname || "Unknown";
        const level = basic.level ?? 0;
        const region = basic.region || "BD";
        const likes = basic.liked ?? 0;
        const avatarUrl =
          data?.data?.outfitImageUrl ||
          `https://noobs-api.top/api/ff-info-pic?uid=${encodeURIComponent(uid)}`;

        playerNickname.textContent = nickname;
        verifiedUid.textContent = String(basic.accountId || uid);
        levelPill.textContent = `★ ${t.levelPrefix} ${level}`;
        regionPill.textContent = `📍 ${region}`;
        likesPill.textContent = `👍 ${likes}`;

        if (avatarUrl) {
          gameAvatarImg.src = avatarUrl;
          avatarWrap.classList.add("has-img");
        } else {
          avatarWrap.classList.remove("has-img");
        }

        saveRecentUid(String(basic.accountId || uid), nickname);

        verifyCard.style.display = "none";
        verifiedCard.classList.add("show");
        setSubtext(t.subtext, false);
      } catch {
        setSubtext(t.netError, true);
      } finally {
        verifyBtn.disabled = false;
      }
    }

    verifyBtn.addEventListener("click", verifyPlayer);

    uidInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        verifyPlayer();
      }
    });

    changeBtn.addEventListener("click", () => {
      verifiedCard.classList.remove("show");
      verifyCard.style.display = "block";
      uidInput.focus();
    });

    renderRecentDropdown();
  </script>
</body>
</html>
