<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault - Top Up Center</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1f2937;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --accent-color: #eab308; /* Yellow accent for Game Vault */
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --header-bg: #1e293b;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
            transition: background 0.3s, color 0.3s;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--header-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container img {
            height: 32px;
            object-fit: contain;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Language Button */
        .lang-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-color);
        }

        /* Sign In Button */
        .signin-btn {
            background: var(--accent-color);
            color: #000;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Hero Banner Slogan */
        .hero-banner {
            text-align: center;
            margin-bottom: 20px;
        }
        .hero-banner p {
            font-size: 16px;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Image Slider Section (2 Banners) */
        .slider-container {
            position: relative;
            width: 100%;
            height: 190px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin-bottom: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Modal Overlay for Language & Dark Mode */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: var(--header-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-color);
        }

        /* Dark Mode Toggle Row inside Modal */
        .dark-mode-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: var(--bg-color);
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-round {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider-round:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider-round {
            background-color: #22c55e;
        }

        input:checked + .slider-round:before {
            transform: translateX(22px);
        }

        /* Language Options List */
        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            background: var(--bg-color);
        }

        .lang-option.selected {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.05);
        }

        .lang-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--header-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <!-- আপনার লোগো ফাইলটি logo.png নামে গিটহাবে রাখতে হবে -->
            <img src="logo.png" alt="Game Vault" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
            <span id="fallback-logo" style="display:none; font-weight:800; font-size:20px; color:var(--accent-color);">GAME VAULT</span>
        </div>
        <div class="header-right">
            <div class="lang-trigger" onclick="openModal()">
                <span>🇺🇸 EN</span> <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
            </div>
            <a href="/login" class="signin-btn"><i class="fa-regular fa-user"></i> Sign In</a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Hero Slogan -->
        <div class="hero-banner">
            <p>Topup in seconds - available 24/7!</p>
        </div>

        <!-- Image Slider (2 Banners looping) -->
        <div class="slider-container">
            <div class="slide active"><img src="slide1.png" alt="Banner 1"></div>
            <div class="slide"><img src="slide2.png" alt="Banner 2"></div>
        </div>
    </div>

    <!-- Language & Dark Mode Modal -->
    <div class="modal-overlay" id="langModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>Language & Theme</span>
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Dark Mode Toggle -->
            <div class="dark-mode-row">
                <div style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
                    <i class="fa-solid fa-moon"></i> Dark Mode
                </div>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
                    <span class="slider-round"></span>
                </label>
            </div>

            <!-- Languages -->
            <div class="lang-option selected" onclick="selectLang('en')">
                <div class="lang-left">
                    <span>🇺🇸</span> English
                </div>
                <i class="fa-solid fa-check" style="color: #22c55e;"></i>
            </div>

            <div class="lang-option" onclick="selectLang('bn')">
                <div class="lang-left">
                    <span>🇧🇩</span> বাংলা
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="/transaction-history" class="nav-item">
            <i class="fa-solid fa-file-lines"></i>
            <span>Orders</span>
        </a>
        <a href="/support" class="nav-item">
            <i class="fa-solid fa-headset"></i>
            <span>Support</span>
        </a>
        <a href="/profile" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        // Modal Open/Close Logic
        function openModal() {
            document.getElementById('langModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('langModal').style.display = 'none';
        }

        // Dark Mode Toggle Logic
        function toggleDarkMode() {
            if (document.getElementById('darkModeToggle').checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            }
        }

        // Check saved theme on load
        if (localStorage.getItem('theme') === 'dark') {
            document.getElementById('darkModeToggle').checked = true;
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // Language Select dummy function
        function selectLang(lang) {
            alert('Language switched to: ' + (lang === 'bn' ? 'বাংলা' : 'English'));
            closeModal();
        }

        // Banner Slider Auto-Loop (Changes every 3.5 seconds)
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        setInterval(nextSlide, 3500);
    </script>
</body>
</html>
