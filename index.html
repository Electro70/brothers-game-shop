<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leak Studio BD - Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 30px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎮 Auto Top-Up BD</h2>
    <form id="orderForm">
        <div class="form-group">
            <label>গেম সিলেক্ট করুন</label>
            <select id="game">
                <option value="freefire">Free Fire (Diamonds)</option>
                <option value="pubg">PUBG Mobile (UC)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>প্লেয়ার ইউআইডি (UID)</label>
            <input type="text" id="uid" placeholder="আপনার গেম ইউআইডি লিখুন" required>
        </div>

        <div class="form-group">
            <label>প্যাকেজ নির্বাচন করুন</label>
            <select id="package">
                <option value="100">100 Diamonds - 85 BDT</option>
                <option value="310">310 Diamonds - 250 BDT</option>
            </select>
        </div>

        <button type="submit">অর্ডার নিশ্চিত করুন</button>
    </form>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const uid = document.getElementById('uid').value;
        const pkg = document.getElementById('package').value;
        alert(`সফল! UID: ${uid} এর জন্য ${pkg} ডায়মন্ডের অর্ডার সাবমিট হয়েছে।`);
    });
</script>

</body>
</html>
