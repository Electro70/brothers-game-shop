<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault - Login</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1f2937;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --accent-color: #eab308; /* Game Vault Yellow Accent */
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --header-bg: #1e293b;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-logo h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-color);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .auth-btn {
            width: 100%;
            background: var(--accent-color);
            color: #1f2937;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
        }

        .google-btn {
            width: 100%;
            background: #ffffff;
            color: #334155;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .google-btn:hover {
            background: #f1f5f9;
        }

        #error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-logo">
            <h1>GAME VAULT</h1>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Sign in to your account</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div id="error-msg"></div>

            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="divider">OR</div>

        <button type="button" id="google-login-btn" class="google-btn">
            <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
        </button>
    </div>

    <!-- Firebase Auth Logic Script -->
    <script type="module">
        import { auth, googleProvider, signInWithEmailAndPassword, signInWithPopup } from "./firebase.js";

        const loginForm = document.getElementById('login-form');
        const googleBtn = document.getElementById('google-login-btn');
        const errorMsg = document.getElementById('error-msg');

        // Email & Password Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "index.html"; // সফলভাবে লগইন হলে হোমপেজে চলে যাবে
            } catch (error) {
                errorMsg.innerText = "Invalid email or password. Please try again.";
            }
        });

        // Google Sign-In
        googleBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = "index.html"; // সফলভাবে লগইন হলে হোমপেজে চলে যাবে
            } catch (error) {
                errorMsg.innerText = "Google Sign-In failed. Please try again.";
            }
        });
    </script>
</body>
</html>
